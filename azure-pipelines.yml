trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  serviceConnection: 'azure-terraform-sc'      # Name of your Azure Resource Manager service connection
  backendResourceGroup: 'tfstate-rg'           # RG that holds the state storage account
  backendStorageAccount: 'tfstatekarthik001'   # Globally unique storage account name
  backendContainer: 'tfstate'                  # Blob container name
  backendKey: 'dev.terraform.tfstate'          # State file name
  workingDir: '$(System.DefaultWorkingDirectory)'   # Folder containing main.tf (change if in a subfolder)

stages:
  # ---------------------------------------------------------------
  # Stage 1: Validate and Plan
  # ---------------------------------------------------------------
  - stage: Plan
    displayName: Terraform Plan
    jobs:
      - job: plan
        steps:
          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: $(workingDir)
              backendServiceArm: $(serviceConnection)
              backendAzureRmResourceGroupName: $(backendResourceGroup)
              backendAzureRmStorageAccountName: $(backendStorageAccount)
              backendAzureRmContainerName: $(backendContainer)
              backendAzureRmKey: $(backendKey)

          - task: TerraformTaskV4@4
            displayName: Terraform Validate
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: $(workingDir)

          - task: TerraformTaskV4@4
            displayName: Terraform Plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: $(workingDir)
              environmentServiceNameAzureRM: $(serviceConnection)
              commandOptions: '-out=tfplan'

          - publish: $(workingDir)/tfplan
            artifact: tfplan
            displayName: Publish plan

  # ---------------------------------------------------------------
  # Stage 2: Apply (pauses for approval if the 'dev' environment has one)
  # ---------------------------------------------------------------
  - stage: Apply
    displayName: Terraform Apply
    dependsOn: Plan
    condition: succeeded()
    jobs:
      - deployment: apply
        environment: 'dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - download: current
                  artifact: tfplan

                - task: TerraformInstaller@1
                  displayName: Install Terraform
                  inputs:
                    terraformVersion: 'latest'

                - task: TerraformTaskV4@4
                  displayName: Terraform Init
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: $(workingDir)
                    backendServiceArm: $(serviceConnection)
                    backendAzureRmResourceGroupName: $(backendResourceGroup)
                    backendAzureRmStorageAccountName: $(backendStorageAccount)
                    backendAzureRmContainerName: $(backendContainer)
                    backendAzureRmKey: $(backendKey)

                - task: TerraformTaskV4@4
                  displayName: Terraform Apply
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: $(workingDir)
                    environmentServiceNameAzureRM: $(serviceConnection)
                    commandOptions: '$(Pipeline.Workspace)/tfplan/tfplan'


